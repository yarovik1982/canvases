  <main class="main">
    <div class="container">
      <h2 class="title">Балка</h2>
      <canvas id="beam" width="800" height="400" title="Кликните по оси X "></canvas>
    </div>
    <div class="container">
      <h2 class="title">Линия влияния поперечной силы</h2>
      <canvas id="canvas-2" width="800" height="400"></canvas>
    </div>
    <div class="container">
      <h2 class="title">Линия влияния изгибающего момента</h2>
      <canvas id="canvas-3" width="800" height="400"></canvas>
    </div>
    <div class="container">
      <h2 class="title">Линия влияния реакции опор</h2>
      <canvas id="canvas-4" width="800" height="400"></canvas>
    </div>
  </main>

  <!-- Модальное окно -->
    <div class="modal modal-support" id="modal-support">
      <h3>Добавление опор</h3>
      <div class="modal__header">
         <button class="modal__close">&times;</button>
      </div>
      <div class="modal-row">
         <button class="btn btn-size-32" data-literal="O" id="support">
            <img src="./images/support.svg" alt="">
         </button>
         <button class="btn btn-size-32" data-literal="S" id="hinge">
            <img src="./images/hinge.svg" alt="">
         </button>
         <button class="btn btn-size-32" data-literal="OF" id="fixedSupport">
            <img src="./images/fixedSupport.svg" alt="">
         </button>
         <button class="btn btn-size-32" data-literal="ZL" id="sealingLeft">
            <img src="./images/sealingLeft.svg" alt="">
         </button>
         <button class="btn btn-size-32" data-literal="ZR" id="sealingRight">
            <img src="./images/sealingRight.svg" alt="">
         </button>
      </div>
      <div class="modal-group">
         <label for="inpSupports" style="font-size: 12px;">Введите верное значение в (м)</label>
         <input type="number" id="inpSupports" class="modal-input" value="" autocomplete="off">
      </div>
      <div class="modal-group"
         style="display: flex;padding-top: 8px;align-items: center;justify-content: space-between;">
         <button class="btn " id="btn-cansel">Отменить</button>
         <button class="btn " id="btn-support-save">Сохранить</button>
      </div>
   </div> 


  <div class="modal modal-offset" id="modal-offset">
    <div class="modal__header">
      <button class="btn btn-32" id="btn-close-modal" style="margin-left: auto;">&times;</button>
    </div>
    <div class="modal-row">
      <label for="inpZmax">Длина балки (м)</label>
      <input type="number" class="modal-input" id="inpZmax" value="20" min="1" step="0.5">
    </div>
    <div class="modal-row">
      <button class="btn" id="btn-reset">Сброс</button>
      <button class="btn" id="btn-save-modal">Сохранить</button>
    </div>
  </div>

        this.xMin = xMin;
        this.xMax = xMax;
        this.yMin = yMin;

      // Преобразование логических координат в экранные
      toScreen(logicalX, logicalY) {
        const screenX = this.x0 + (logicalX - this.xMin) * this.xScale;
        const screenY = this.y0 - (logicalY - this.yMin) * this.yScale;
        return { x: screenX, y: screenY };
      }

      drawGrid(xCell, yCell, color = "lightgray") {
        this.ctx.save();
        this.ctx.lineWidth = 0.5;
        this.ctx.strokeStyle = color;
        this.ctx.beginPath();

        let x = this.xMin;
        while (x <= this.xMax) {
          const { x: sx } = this.toScreen(x, 0);
          const { y: syTop } = this.toScreen(x, this.yMax);
          const { y: syBottom } = this.toScreen(x, this.yMin);
          this.ctx.moveTo(sx, syTop);
          this.ctx.lineTo(sx, syBottom);
          x += xCell;

        let y = this.yMin;
        while (y <= this.yMax) {

      drawAxes(xLabel = "X", yLabel = "Y", color = "black") {

        // Ось X: от xMin до xMax, по Y=0

        this.ctx.textAlign = "center";
        this.ctx.textBaseline = "top";
        this.ctx.fillText(xLabel, (xStart + xEnd) / 2, yZero + 10);

        this.ctx.textBaseline = "middle";
        this.ctx.fillText(yLabel, xZero - 20, (yStart + yEnd) / 2);

        this.ctx.restore();
      }

      drawTicks(xCell, yCell, color = "black") {
        this.ctx.save();
        this.ctx.strokeStyle = color;

        let x = this.xMin;

          const { x: sx, y: yZero } = this.toScreen(x, 0);

          const { x: xZero, y: sy } = this.toScreen(0, y);
          this.ctx.moveTo(xZero - 5, sy);
          this.ctx.lineTo(xZero + 5, sy);
          y += yCell;
        }

        this.ctx.stroke();
        this.ctx.restore();
      }

      drawUnits(xCell, yCell, color = "black") {

        this.ctx.font = "10px Arial";
        this.ctx.textAlign = "center";
        this.ctx.textBaseline = "top";

        let x = this.xMin;
        while (x <= this.xMax) {
          const { x: sx, y: yZero } = this.toScreen(x, 0);
          this.ctx.fillText(x, sx, yZero + 8);
          x += xCell;
        }

        this.ctx.textAlign = "right";
        this.ctx.textBaseline = "middle";

        let y = this.yMin;
        while (y <= this.yMax) {

            continue;
          }
          const { x: xZero, y: sy } = this.toScreen(0, y);

        this.drawTicks(1, 1);
        this.drawUnits(1, 1);
      }
    }
